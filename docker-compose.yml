services:
  supervisor:
    build: .
    ports:
      - "50051:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/data/agents
    environment:
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - DATA_ROOT=/data/agents
      - DSH_IMAGE=dsh-agent:latest
      - MAX_CONTAINERS=50
      - CONTAINER_MEMORY=512m
      - CONTAINER_CPU=1
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://aihub.juxieyun.com/aihub-api/v1}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-deepseek-v4-flash-0731}
    restart: unless-stopped

volumes:
  agent-data:
