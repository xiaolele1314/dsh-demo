syntax = "proto3";

package dsh.cloud.v1;

service AgentRuntime {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  rpc DestroyAgent(DestroyAgentRequest) returns (DestroyAgentResponse);
  rpc GetAgentStatus(GetAgentStatusRequest) returns (AgentStatusResponse);
  rpc SendMessage(SendMessageRequest) returns (stream ChatChunk);
}

message CreateAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
  AgentBlueprint blueprint = 3;
}
message CreateAgentResponse {
  bool success = 1;
  string error_message = 2;
}
message StopAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
}
message StopAgentResponse {
  bool success = 1;
  string error_message = 2;
}
message DestroyAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
}
message DestroyAgentResponse {
  bool success = 1;
}
message GetAgentStatusRequest {
  string tenant_id = 1;
  string agent_id = 2;
}
message AgentStatusResponse {
  string status = 1;
  int32 active_sessions = 2;
  double memory_usage_mb = 3;
  int64 uptime_seconds = 4;
}

message AgentBlueprint {
  string provider = 1;
  string model = 2;
  int32 max_tokens = 3;
  string api_base = 4;
  string system_prompt = 5;
  repeated SkillBinding skill_bindings = 6;
  repeated McpBinding mcp_bindings = 7;
  map<string, string> credential_refs = 8;
}
message SkillBinding {
  string skill_id = 1;
  string name = 2;
  string content = 3;
}
message McpBinding {
  string mcp_id = 1;
  string name = 2;
  string server_type = 3;
  string command = 4;
  repeated string args = 5;
  string url = 6;
}

message SendMessageRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string message = 4;
}
message ChatChunk {
  string session_id = 1;
  oneof payload {
    string text_delta = 2;
    ToolCallEvent tool_call = 3;
    ChatFinished finished = 4;
    ChatError error = 5;
  }
}
message ToolCallEvent {
  string tool_name = 1;
  string arguments_json = 2;
  string result_json = 3;
}
message ChatFinished {
  string full_content = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
  string stop_reason = 4;
}
message ChatError {
  string code = 1;
  string message = 2;
}
